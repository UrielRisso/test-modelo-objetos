<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Test Modelo de Objeto</title>

    <style>
        :root {
            --color-primary: #2daf63;
            --color-primary-hover: #7fe4a9;

            --color-background: #f4f6f8;
            --color-surface: #ffffff;

            --color-text: #202124;
            --color-text-secondary: #666666;

            --color-border: #e1e4e8;

            --color-success: #22c55e;
            --color-error: #ef4444;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #202124;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 700px;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        /* Encabezado */

        .header {
            margin-bottom: 30px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;

            font-size: 14px;
            color: #666;
        }

        .progress-bar {
            width: 100%;
            height: 8px;

            background: #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            width: 0%;

            background: var(--color-primary);
            transition: width 0.3s ease;
        }

        /* Pregunta */

        .question {
            font-size: 26px;
            line-height: 1.3;
            margin-bottom: 30px;
        }

        /* Opciones */

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            width: 100%;

            padding: 18px 20px;

            border: 2px solid #e1e4e8;
            border-radius: 12px;

            background: white;

            text-align: left;
            font-size: 16px;

            cursor: pointer;

            transition: all 0.2s ease;
        }

        .option:hover {
            border-color: var(--color-primary-hover);
            background: var(--color-primary);
        }

        .option.selected {
            border-color: var(--color-primary);
            background: var(--color-primary-hover);
        }

        /* Botón */

        .actions {
            margin-top: 30px;

            display: flex;
            justify-content: flex-end;
        }

        .next-button {
            padding: 13px 25px;

            border: none;
            border-radius: 10px;

            background: var(--color-primary);
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .next-button:hover {
            background: var(--color-primary-hover);
        }

        .next-button:disabled {
            background: #b7b7c7;
            cursor: not-allowed;
        }

        .welcome {
            text-align: center;
        }

        .welcome-logo {
            width: 90px;
            height: 90px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: var(--color-primary);

            font-size: 45px;
        }

        .welcome h1 {
            font-size: 34px;
            margin: 0 0 15px;
        }

        .welcome-subtitle {
            font-size: 20px;
            line-height: 1.4;

            margin: 0 auto 15px;

            color: var(--color-text);
        }

        .welcome-description {
            max-width: 550px;

            margin: 0 auto 30px;

            font-size: 16px;
            line-height: 1.6;

            color: var(--color-text-secondary);
        }


        /* =========================
   NOMBRE
   ========================= */

        .name-container {
            max-width: 450px;

            margin: 0 auto 25px;

            text-align: left;
        }

        .name-container label {
            display: block;

            margin-bottom: 8px;

            font-weight: bold;
        }

        .name-container input {
            width: 100%;

            padding: 14px 16px;

            border: 2px solid var(--color-border);
            border-radius: 10px;

            font-size: 16px;

            outline: none;

            transition: border-color 0.2s;
        }

        .name-container input:focus {
            border-color: var(--color-primary);
        }


        /* =========================
   RESULTADO
   ========================= */

        .result {
            text-align: center;
        }

        .result-icon {
            width: 110px;
            height: 110px;

            margin: 0 auto 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: var(--color-primary);

            font-size: 55px;
        }

        .result h1 {
            font-size: 36px;

            margin-bottom: 15px;
        }

        .result p {
            font-size: 18px;
            line-height: 1.6;

            color: var(--color-text-secondary);
        }

        .score {
            margin-top: 25px;

            font-size: 18px;

            color: var(--color-text-secondary);
        }

        .score strong {
            color: var(--color-primary);

            font-size: 28px;
        }


        /* =========================
   OCULTAR ELEMENTOS
   ========================= */

        .hidden {
            display: none !important;
        }

        /* Mobile */

        @media (max-width: 600px) {

            .card {
                padding: 25px;
            }

            .question {
                font-size: 22px;
            }

            .option {
                padding: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">

            <!-- PANTALLA INICIAL -->

            <div id="welcome" class="welcome">

                <div class="">
                   <h1>
                    Análisis y diseño II
                </h1>
                </div>

                <h1>
                    Qué tan desarrollado está tu pensamiento
                    orientado a objetos.
                </h1>

                <p class="welcome-description">
                    Responde las siguientes preguntas. No existen preguntas correctas o incorrectas asique simplemente responde con tu forma de pensar.
                </p>

                <div class="name-container">

                    <label for="nombre">
                        Antes de comenzar, ingresá tu nombre:
                    </label>

                    <input type="text" id="nombre" placeholder="Tu nombre" maxlength="100">

                </div>

                <button id="startButton" class="next-button" disabled>

                    Comenzar test

                </button>

            </div>


            <!-- TEST -->

            <div id="test" class="hidden">

                <div class="header">

                    <div class="progress-info">

                        <span id="questionNumber">
                            Pregunta 1 de 5
                        </span>

                        <span id="percentage">
                            0%
                        </span>

                    </div>

                    <div class="progress-bar">

                        <div id="progress" class="progress">
                        </div>

                    </div>

                </div>


                <h2 id="question" class="question">
                </h2>


                <div id="options" class="options">
                </div>


                <div class="actions">

                    <button id="nextButton" class="next-button" disabled>

                        Siguiente

                    </button>

                </div>

            </div>


            <!-- RESULTADO -->

            <div id="result" class="result hidden">

                <h1 id="resultTitle">
                    Resultado
                </h1>

                <p id="resultDescription">
                </p>

            </div>

        </div>

    </div>


    <script src="test.js">

        

    </script>

</body>

</html>
